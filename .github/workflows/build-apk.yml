name: Build Android APK

on:
  workflow_dispatch: # manual trigger from the Actions tab
  push:
    branches: [main]
    paths:
      - 'src/**'
      - 'android/**'
      - 'capacitor.config.ts'
      - 'package.json'
      - 'index.html'
      - '.github/workflows/build-apk.yml'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Install dependencies
        run: npm ci

      - name: Build web app
        run: npm run build

      - name: Sync Capacitor
        run: npx cap sync android

      # Self-provisioned signing: on the first run CI generates the signing
      # keystore and commits it to the repo; every later run reuses it, so
      # all published APKs share one signature and updates install cleanly
      # over previously installed versions (same pattern as the user's other
      # app). Pushes with GITHUB_TOKEN don't re-trigger workflows.
      - name: Ensure signing keystore
        run: |
          if [ ! -f android/app/tradelog-release.keystore ]; then
            keytool -genkeypair -v -keystore android/app/tradelog-release.keystore -alias tradelog \
              -keyalg RSA -keysize 2048 -validity 10000 \
              -storepass tradelog2026 -keypass tradelog2026 \
              -dname "CN=TradeLog, OU=App, O=TradeLog, L=Riyadh, S=Riyadh, C=SA"
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git add -f android/app/tradelog-release.keystore
            git commit -m "CI: provision stable APK signing keystore"
            git push
            echo "Keystore provisioned and committed."
          else
            echo "Using existing signing keystore from the repo."
          fi

      # Release, not debug: a debug APK carries android:debuggable and is not
      # what should be handed out. Both build types use the same signing config,
      # so the certificate is unchanged and this still installs over the
      # currently installed app — the verification step below proves that.
      - name: Build APK
        working-directory: android
        run: >-
          ./gradlew assembleRelease
          -PtradelogVersionCode=${{ github.run_number }}
          -PtradelogVersionName=1.0.${{ github.run_number }}

      - name: Rename APK
        run: cp android/app/build/outputs/apk/release/app-release.apk TradeLog.apk

      # An APK signed by a different key cannot install over the existing app —
      # Android rejects it and the only way out is uninstalling first, losing
      # nothing here but requiring a manual step nobody expects. So fail the
      # build rather than publish an APK whose signer isn't the repo keystore.
      - name: Verify APK signature matches the release keystore
        run: |
          set -euo pipefail
          APKSIGNER=$(ls "$ANDROID_HOME"/build-tools/*/apksigner | sort -V | tail -1)
          "$APKSIGNER" verify --verbose TradeLog.apk

          expected=$(keytool -list -v \
            -keystore android/app/tradelog-release.keystore \
            -alias tradelog -storepass tradelog2026 \
            | awk '/SHA256:/ { print $2; exit }' | tr -d ':' | tr 'A-Z' 'a-z')
          actual=$("$APKSIGNER" verify --print-certs TradeLog.apk \
            | awk '/SHA-256 digest:/ { print $NF; exit }')

          echo "keystore certificate: $expected"
          echo "APK signer:           $actual"
          if [ -z "$expected" ] || [ "$expected" != "$actual" ]; then
            echo "::error::APK is not signed with the repo release keystore; it would not install over the existing app."
            exit 1
          fi
          echo "Signature matches — this APK installs over the existing app."

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: TradeLog-apk
          path: TradeLog.apk
          retention-days: 30

      # Publish/update a rolling release so the APK has a stable, public,
      # direct download URL:
      # https://github.com/HadiTAG7/trade-jornal/releases/latest/download/TradeLog.apk
      - name: Publish APK release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: apk-latest
          name: TradeLog — تطبيق أندرويد (v1.0.${{ github.run_number }})
          body: |
            أحدث نسخة APK من TradeLog. نزّلها على الجوال وثبّتها مباشرة.

            **رابط التنزيل المباشر:**
            https://github.com/${{ github.repository }}/releases/latest/download/TradeLog.apk

            مبنية تلقائيًا من `${{ github.sha }}`
          files: TradeLog.apk
          make_latest: true
